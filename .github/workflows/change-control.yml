name: Change control

# Runs both test suites for .claude/hooks/protect-default-branch.sh, the
# defence-in-depth guard described in CLAUDE.md §11: the behaviour suite, and
# the parser-fallback suite that runs the guard with each JSON parser and with
# none.
#
# WHY THIS WORKFLOW EXISTS. Until 2026-08-23 nothing ran that suite. A change to
# the guard could only be checked by reasoning about it, which is the wrong
# footing for a security control and had a real cost: a fix to the detached-HEAD
# recovery path (PR #233) sat unexecuted, and the session that wrote it was the
# one the bug had locked out of every file write.
#
# DELIBERATELY NOT PATH-FILTERED. It would be tempting to run this only when
# `.claude/**` changes. Do not. A path-gated job never reports on the pull
# requests it skips, so if this context is ever added to the branch ruleset as
# required, every unrelated pull request would wait forever for a check that is
# never going to arrive — the trap CLAUDE.md §12 already calls out for the
# path-gated migration job. The suite runs in seconds, so always reporting costs
# almost nothing and keeps the context safe to require.
#
# The emitted check context is the job name below: `Change-control guard`.
# Making it *blocking* is a separate, owner-only change to the GitHub ruleset
# (CLAUDE.md §12) — this workflow only makes it report.
on:
  pull_request:
  push:
    branches: [claude/project-build-ie4b56, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Change-control guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # A guard that passes its own tests but is no longer wired into the
      # harness protects nothing. Assert the registration before the behaviour.
      - name: The guard is still registered, and still covers every writing tool
        run: |
          set -euo pipefail
          SETTINGS=.claude/settings.json
          test -f "$SETTINGS" || { echo "::error::$SETTINGS is missing — the guard would not run at all"; exit 1; }

          # Take the matcher from the PreToolUse entry that actually registers
          # THIS guard. Selecting by command rather than by position means an
          # added or reordered hook entry cannot leave this assertion reading
          # some other entry's matcher, and an empty result here is itself the
          # registration failure.
          MATCHER="$(jq -r '
            .hooks.PreToolUse[]?
            | select(any(.hooks[]?; (.command // "") | test("protect-default-branch[.]sh")))
            | .matcher // empty
          ' "$SETTINGS")"

          test -n "$MATCHER" || {
            echo "::error::$SETTINGS no longer registers protect-default-branch.sh as a PreToolUse hook"
            exit 1
          }

          # Compare whole alternatives, never substrings. A plain `grep -q Edit`
          # also matches MultiEdit and NotebookEdit, so a matcher that had
          # dropped the standalone Edit alternative would sail through this
          # check while every Edit call went unguarded. Split on `|` and match
          # each expected tool as a complete line.
          ALTERNATIVES="$(printf '%s' "$MATCHER" | tr '|' '\n')"
          for TOOL in Bash Edit Write MultiEdit NotebookEdit; do
            printf '%s\n' "$ALTERNATIVES" | grep -qx "$TOOL" || {
              echo "::error::the PreToolUse matcher ($MATCHER) does not cover $TOOL as its own alternative — writes through it would be unguarded"
              exit 1
            }
          done
          echo "registered for: $MATCHER"

      - name: The guard and both test suites parse
        run: |
          set -euo pipefail
          bash -n .claude/hooks/protect-default-branch.sh
          bash -n .claude/hooks/protect-default-branch.test.sh
          bash -n .claude/hooks/test-protect-default-branch.sh
          echo "guard and both test suites parse"

      # The suite needs bash, git (>= 2.28 for `git init -b`) and one of
      # jq / python3 / node for the hook's own JSON parsing. ubuntu-latest
      # provides all of them, so there is nothing to install.
      - name: Guard behaviour
        run: bash .claude/hooks/protect-default-branch.test.sh

      # The step above only ever exercises the parser the runner offers first.
      # This suite gives the guard an isolated PATH per scenario: jq only,
      # python3 only, node only, a broken python3 in front of node, and NO
      # working parser, where the guard cannot read its own input and must
      # refuse rather than allow. No workflow ran it until 2026-11-11, and a
      # guard changed to fail open on that path passed the step above 80/80.
      # GUARD_TEST_STRICT=1 makes a skipped scenario a failure, so a runner
      # image without node or python3 cannot quietly shrink the suite.
      - name: Guard behaviour with each JSON parser, and with none
        run: GUARD_TEST_STRICT=1 bash .claude/hooks/test-protect-default-branch.sh

      # The other half of change control is WHAT CODE a job runs, not only who
      # may push: several jobs hold a production credential, and a tag or an
      # `@latest` would run whatever was current that day, next to it. Every
      # action must be pinned to a commit SHA and every tool a workflow
      # downloads at run time to an exact version. Node builtins only, so there
      # is still nothing to install.
      - name: Every action and downloaded tool is pinned
        run: node scripts/check-workflow-pins.mjs
