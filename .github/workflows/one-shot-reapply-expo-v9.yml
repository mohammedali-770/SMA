name: One-shot reapply Expo v9
on:
  push:
    branches: [chore/expo-action-node24]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/expo-action-node24
          persist-credentials: true
      - name: Replace the two reviewed Expo action refs only
        shell: python
        run: |
          from pathlib import Path
          old = 'expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8'
          new = 'expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0'
          changed = []
          for name in ['eas-build.yml', 'eas-status.yml']:
              p = Path('.github/workflows') / name
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected v8 ref missing in {p}')
              p.write_text(text.replace(old, new, 1))
              changed.append(str(p))
          print('\n'.join(changed))
      - name: Commit only the two EAS workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/eas-build.yml .github/workflows/eas-status.yml
          git diff --cached --check
          git commit -m "ci(eas): upgrade Expo action to Node 24 runtime"
          git push origin HEAD:chore/expo-action-node24
