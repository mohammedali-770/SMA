name: Production gates

# Customer-facing production gates. This workflow is read-only unless the
# separately owner-configured Vercel deploy gate is explicitly enabled.
on:
  pull_request:
  push:
    branches: [claude/project-build-ie4b56, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the selected protected commit after every production gate is green"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: production-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build (Vite + Expo web export)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (exactly what Vercel runs)
        run: npm run build

      - name: Verify both bundles were emitted
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::admin console bundle missing (dist/index.html)"; exit 1; }
          test -f dist/app/index.html || { echo "::error::customer web app bundle missing (dist/app/index.html)"; exit 1; }
          echo "dist/index.html and dist/app/index.html both present"

      - name: No source maps in the shipped bundle
        run: |
          set -euo pipefail
          MAPS="$(find dist -name '*.map' -type f | head -20)"
          if [ -n "$MAPS" ]; then
            echo "::error::source maps present in dist/ — they must not ship"
            echo "$MAPS"
            exit 1
          fi
          echo "no .map files in dist/"

  edge-functions:
    name: Edge Function typecheck (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"

      - name: Typecheck all Edge Function entrypoints
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts

  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      # No HIGH/CRITICAL exceptions exist for the web/admin tree. The wrapper
      # keeps the audit fail-closed and emits exact advisory/package annotations
      # so failures remain diagnosable through the GitHub checks API.
      - name: Audit web dependencies
        run: node scripts/audit-web-high.mjs

      # Do not weaken this to `|| true`, `--omit`, or a lower audit level.
      # The script is fail-closed and permits only the two reviewed image-size
      # HIGH advisories that currently have no patched release and are reachable
      # solely through Metro/Expo build tooling. It expires automatically and
      # any other high/critical advisory still fails the job.
      - name: Audit mobile dependencies
        run: node scripts/audit-mobile-high.mjs

  deploy:
    name: Deploy to Vercel (gated on CI)
    needs: [build, edge-functions, audit]
    if: >-
      github.ref == 'refs/heads/claude/project-build-ie4b56' &&
      vars.DEPLOY_GATE_ENABLED == 'true' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - name: Refuse to run half-configured
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing VERCEL_TOKEN"
          [ -n "$ORG" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$PROJECT" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::DEPLOY_GATE_ENABLED is true but these secrets are missing:$missing"
            echo "::error::With Vercel auto-deploy off and this job unable to run, nothing would deploy. Set them or unset the variable."
            exit 1
          fi
          echo "all three credentials present"

      - name: Wait for every production gate on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          required() {
            printf '%s\n' \
              'design-system' \
              'Production build (Vite + Expo web export)' \
              'Edge Function typecheck (Deno)' \
              'Dependency audit (high+)' \
              'SQL suites gate'
          }

          deadline=$(( SECONDS + 1500 ))
          while : ; do
            if ! body=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                                 -H "Accept: application/vnd.github+json" \
                                 "https://api.github.com/repos/$REPO/commits/$SHA/check-runs?per_page=100"); then
              echo "::error::could not read check runs for $SHA - refusing to deploy"
              exit 1
            fi

            npend=0; nfail=0; nmiss=0
            while IFS= read -r name; do
              row=$(printf '%s' "$body" | jq -r --arg n "$name" '
                [ .check_runs[]? | select(.name == $n) ] | sort_by(.started_at) | last
                | if . == null then "missing|" else (.status + "|" + (.conclusion // "")) end')
              case "$row" in
                "missing|")          echo "  never reported: $name"; nmiss=$((nmiss+1)) ;;
                "completed|success") ;;
                "completed|skipped") echo "  FAILED (skipped): $name"; nfail=$((nfail+1)) ;;
                completed*)          echo "  FAILED: $name -> ${row#*|}"; nfail=$((nfail+1)) ;;
                *)                   echo "  still running: $name"; npend=$((npend+1)) ;;
              esac
            done < <(required)

            if [ "$nfail" -gt 0 ]; then
              echo "::error::$nfail gate(s) did not pass on $SHA - refusing to deploy"
              exit 1
            fi
            if [ "$npend" -eq 0 ] && [ "$nmiss" -eq 0 ]; then
              echo "every required gate is green on $SHA"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for gates on $SHA - refusing to deploy"
              exit 1
            fi
            sleep 20
          done

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$TOKEN"
          npx --yes vercel@latest build --prod --token="$TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$TOKEN"
