name: Deploy Supabase Functions

# Deploys Supabase Edge Functions to the production project.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW DEPLOYS TO PRODUCTION. Read before changing it.
#
# It used to carry a `push:` trigger with NO `branches:` filter:
#
#     push:
#       paths:
#         - '.github/workflows/deploy-functions.yml'
#
# Combined with a hardcoded production PROJECT_REF and a default function list
# of exactly the four payment functions that CLAUDE.md §6 FREEZES, that meant
# **any push, on any branch, that touched this file deployed frozen payment
# functions to production** — no pull request, no review, no approval. On a push
# event `inputs.functions` is empty, so the old script fell through to the
# payment set. The trigger was not hypothetical: run #4 fired from an unrelated
# feature branch on 2026-07-13. It never actually deployed only because
# SUPABASE_ACCESS_TOKEN has never existed, so all four of its runs died at the
# CLI with "Access token not provided".
#
# The trigger is gone. Deploys are deliberate only: Actions tab → Run workflow.
# See docs/OWNER_ACTIONS.md §15 — which also records that a Supabase access token
# cannot be scoped to one project, and recommends against creating this secret.
# ─────────────────────────────────────────────────────────────────────────────
#
# Deploying an Edge Function requires explicit owner approval every time
# (CLAUDE.md §5). The payment functions deploy as ONE set ('all' below), and only
# after migration 20260824100000_moyasar_payment_provider has been applied: a new
# payment bundle beside an older one can open a Moyasar invoice that nothing
# confirms (supabase/functions/README.md). Nothing here grants any approval; the
# guards below only make it hard to deploy by accident.
#
# Migrations are NOT run here — this only deploys functions, so it can never
# touch the database schema.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated function names. 'all' = the seven payment functions, which deploy as one set."
        type: string
        required: true
        # Deliberately EMPTY. It used to default to the payment set, so opening
        # the dialog and pressing Run deployed frozen payment code. The run now
        # fails unless the operator names what they are deploying.
        default: ""
      confirm:
        description: "Type DEPLOY to confirm you have explicit owner approval for this deploy."
        type: string
        required: true
        default: ""

# Least privilege: only read the checkout. Declared explicitly rather than
# inheriting the repository default, which may be read-write.
permissions:
  contents: read

env:
  PROJECT_REF: wxfmmnihidsdyemasstf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only ever deploy code that is on the production branch. A dispatch against
    # a feature branch is skipped rather than shipping unreviewed code.
    if: github.ref == 'refs/heads/claude/project-build-ie4b56'

    # Requires a GitHub Environment named "production" with the owner as a
    # required reviewer: the job then PAUSES for approval before it can deploy.
    # Create it at Settings → Environments → New environment.
    #
    # NOTE: required reviewers on environments need GitHub Pro/Team. On the
    # current free private plan this line is inert — it does NOT gate anything
    # yet (see CLAUDE.md → Enforcement, and docs/OWNER_ACTIONS.md §3.1). It is
    # declared now so the protection applies the moment the plan changes.
    environment: production

    steps:
      - name: Confirm this deploy was asked for
        env:
          CONFIRM: ${{ inputs.confirm }}
          FNS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "DEPLOY" ]; then
            echo "::error::Confirmation not given. Re-run and type DEPLOY in the confirm field. Deploying an Edge Function needs explicit owner approval (CLAUDE.md §5)."
            exit 1
          fi
          if [ -z "${FNS// /}" ]; then
            echo "::error::No functions named. Pass a space-separated list, or 'all' for the payment set. There is deliberately no default."
            exit 1
          fi
          echo "Confirmed. Requested: ${FNS}"

      - name: Checkout
        # Pinned to a commit SHA, not a floating tag: a tag can be repointed,
        # and this job deploys to production.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          # An exact version, not `latest`: the CLI is downloaded when the job
          # runs, next to whatever credential the job holds. Bump deliberately
          # (scripts/check-workflow-pins.mjs fails on `latest`). 2.122.0 is the
          # last 2.x release; 3.0.0 was a week old when this was pinned.
          version: 2.122.0

      - name: Deploy functions
        env:
          # Scoped to this step rather than the whole workflow, so no other step
          # can read the token.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FNS_INPUT: ${{ inputs.functions }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so nothing can be deployed. Read docs/OWNER_ACTIONS.md §15 BEFORE adding it."
            exit 1
          fi

          # The JWT flag for one function, read from supabase/config.toml when
          # the job runs, so no list here can drift from it: `verify_jwt =
          # false` prints --no-verify-jwt, `true` prints nothing, and anything
          # else (no [functions.<name>] table, no verify_jwt line, any other
          # value) fails. deployFunctionsWiring.test.ts runs this function
          # against the real config.toml for every function.
          jwt_flag() {
            local value
            value="$(awk -v table="[functions.$1]" '
              { line = $0; sub(/^[[:space:]]+/, "", line); sub(/[[:space:]]*(#.*)?$/, "", line) }
              line == table { inside = 1; next }
              line ~ /^\[/ { inside = 0; next }
              inside && line ~ /^verify_jwt[[:space:]]*=/ {
                sub(/^verify_jwt[[:space:]]*=[[:space:]]*/, "", line); print line; exit
              }
            ' supabase/config.toml)"
            case "$value" in
              false) echo "--no-verify-jwt" ;;
              true) echo "" ;;
              *) return 1 ;;
            esac
          }

          FNS="$FNS_INPUT"
          if [ "$FNS" = "all" ]; then
            # Every payment function, the admin sandbox return page included.
            FNS="payment-initiate payment-verify payment-webhook payment-return payment-refund payment-test-config payment-admin-test-return"
            echo "::warning::Deploying the whole payment set. It needs its own explicit owner approval (CLAUDE.md §5), and migration 20260824100000_moyasar_payment_provider must already be applied."
          fi

          for fn in $FNS; do
            # Reject anything that is not a real function directory in this
            # checkout, so a typo cannot be sent to the Supabase CLI.
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "::error::No such function in this checkout: supabase/functions/${fn}/index.ts"
              exit 1
            fi
            # A function whose callers carry no Supabase JWT (a provider
            # webhook, a browser GET, a scheduler or the service role) is
            # marked verify_jwt = false in config.toml and deploys with
            # --no-verify-jwt; every other keeps JWT verification ON. This used
            # to be a hard-coded list, which drifted: until 2026-11-11 it named
            # only payment-webhook and payment-return, so payment-refund would
            # have deployed with verification on and refused the refund cron.
            if ! FLAGS="$(jwt_flag "$fn")"; then
              echo "::error::supabase/config.toml has no [functions.${fn}] table with verify_jwt = true or false, so its JWT setting is unknown. Add one before deploying it."
              exit 1
            fi
            echo "::group::Deploy $fn ($FLAGS)"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" $FLAGS
            echo "::endgroup::"
          done
