name: EAS Build (mobile)

# Sends a native build request to Expo's EAS cloud for the apps/mobile app
# (slug: spicy-meal). Needs an EXPO_TOKEN repository secret.
# Trigger: Actions tab ("Run workflow") or push a tag like `mobile-build-1`.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, production, development]
        default: preview
  push:
    tags:
      - 'mobile-build-*'

# Least privilege. This job talks to EAS, not to this repository — it never
# comments, pushes, publishes or touches releases. Declared explicitly rather
# than inheriting the repository default, which may be read-write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        # Pinned to a commit SHA, matching the other workflows here: a tag can
        # be repointed, and this job holds EXPO_TOKEN and can start a store build.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes to the repository.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Single source of truth: .nvmrc (Node 22 — see docs/NODE_VERSION.md).
          # Already 22; reading the file keeps it that way if the standard moves.
          # `node-version-file` resolves from the repository root and is
          # unaffected by this job's `working-directory: apps/mobile`.
          node-version-file: .nvmrc

      - name: Setup EAS / Expo
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # A production build without SENTRY_AUTH_TOKEN succeeds and ships — it just
      # uploads no source maps, so every crash in that release arrives as
      # unsymbolicated minified frames and is effectively undiagnosable. The
      # Expo config plugin drops itself when the token is absent (app.config.js)
      # and warns; a warning in a --no-wait cloud build is a warning nobody reads.
      #
      # Fail the PRODUCTION profile loudly instead. preview/development builds are
      # deliberately unaffected: they set SENTRY_DISABLE_AUTO_UPLOAD=true in
      # eas.json and are not expected to symbolicate.
      #
      # The secret is read via env, never interpolated into the script, so its
      # value cannot reach the log.
      - name: Preflight — a production build must be able to symbolicate
        if: ${{ (inputs.profile || 'preview') == 'production' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set, so this production build would ship without source maps and every crash report would be unreadable. Add it under Settings -> Secrets and variables -> Actions (see issue #81 and docs/SENTRY_OBSERVABILITY.md), or run the preview profile instead."
            exit 1
          fi
          echo "SENTRY_AUTH_TOKEN present — source maps will upload."

      - name: Install dependencies
        run: npm ci

      # NOTE: a `mobile-build-*` tag push has no `inputs`, so it falls through to
      # the `preview` profile — an INTERNAL APK, not a submittable production
      # build. Tagging is therefore not a release. Use the Actions tab and pick
      # `production` explicitly. Left as-is rather than silently changing what a
      # tag does, because that would alter release behaviour without approval.
      #
      # For production iOS, --auto-submit queues the finished archive for App
      # Store Connect/TestFlight using submit.production.ios in eas.json. Android
      # is intentionally NOT auto-submitted. When platform=all, split the calls
      # so only the iOS half gets --auto-submit; this fixes the prior PR #207 P1
      # where `all` built iOS successfully but silently skipped TestFlight.
      - name: Submit EAS build
        env:
          PLATFORM: ${{ inputs.platform || 'android' }}
          PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          set -euo pipefail

          if [ "$PROFILE" != "production" ]; then
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
            exit 0
          fi

          case "$PLATFORM" in
            ios)
              eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
              ;;
            android)
              eas build --platform android --profile production --non-interactive --no-wait
              ;;
            all)
              # Keep Android as build-only. Queue iOS separately with auto-submit
              # so TestFlight is never skipped just because "all" was selected.
              eas build --platform android --profile production --non-interactive --no-wait
              eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
              ;;
            *)
              echo "::error::Unsupported platform: $PLATFORM"
              exit 2
              ;;
          esac