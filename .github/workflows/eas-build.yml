name: EAS Build (mobile)

# Sends a native build request to Expo's EAS cloud for the apps/mobile app
# (slug: spicy-meal). Needs an EXPO_TOKEN repository secret.
# Trigger: Actions tab ("Run workflow") or push a tag like `mobile-build-1`.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, production, development]
        default: preview
  push:
    tags:
      - 'mobile-build-*'

# Least privilege. This job talks to EAS, not to this repository — it never
# comments, pushes, publishes or touches releases. Declared explicitly rather
# than inheriting the repository default, which may be read-write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        # Pinned to a commit SHA, matching the other workflows here: a tag can
        # be repointed, and this job holds EXPO_TOKEN and can start a store build.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes to the repository.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Single source of truth: .nvmrc (Node 22 — see docs/NODE_VERSION.md).
          # Already 22; reading the file keeps it that way if the standard moves.
          # `node-version-file` resolves from the repository root and is
          # unaffected by this job's `working-directory: apps/mobile`.
          node-version-file: .nvmrc

      - name: Setup EAS / Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          # An exact version, not `latest`: eas-cli runs with EXPO_TOKEN, which
          # can start a store build, so a bad release would run with it the next
          # time this job did. Bump deliberately, ideally in the same change as
          # an Expo SDK upgrade (scripts/check-workflow-pins.mjs fails on
          # `latest`). 25.3.0 was three weeks old when pinned and the last of its
          # line; 26.0.0 was superseded within two days.
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      # --ignore-scripts: EXPO_TOKEN is already in this job's environment (the
      # Setup EAS step exports it), so every package install script would run with
      # it. Only one package in this tree has one (@sentry/cli, which fetches a
      # binary this job never calls), and the cloud build does its own install.
      # Measured 2026-11-10: the resolved Expo config, public and prebuild, is
      # byte-identical with and without scripts. docs/DEPENDENCY_ADVISORIES.md.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A production build without SENTRY_AUTH_TOKEN succeeds and ships — it just
      # uploads no source maps, so every crash in that release arrives as
      # unsymbolicated minified frames and is effectively undiagnosable. The
      # Expo config plugin drops itself when the token is absent (app.config.js)
      # and warns; a warning in a --no-wait cloud build is a warning nobody reads.
      #
      # Fail the PRODUCTION profile loudly instead. preview/development builds are
      # deliberately unaffected: they set SENTRY_DISABLE_AUTO_UPLOAD=true in
      # eas.json and are not expected to symbolicate.
      #
      # ASK THE STORE THE BUILD READS. The cloud build evaluates app.config.js
      # with the EAS `production` environment (eas.json: build.production
      # .environment), not with this job's environment, so the check is against
      # EAS. Until 2026-11-12 it tested a GitHub secret of the same name instead,
      # which the build never reads: it passed while EAS had lost the token, and
      # blocked a correct build where only EAS held it.
      #
      # `eas env:list production --format short --scope <project|account>` is
      # the eas-cli 25.3.0 form, confirmed from that version's --help and source
      # (it has no --non-interactive flag; the positional environment means it
      # never prompts). It is a read. It prints NAME=value lines, and a
      # plaintext variable's value is printed in full, so its output is captured
      # and never echoed: only the names are extracted, and only the answer for
      # SENTRY_AUTH_TOKEN and a count are logged. Must run after the install
      # step: eas reads the project id from the app config.
      - name: Preflight — the EAS production environment must hold SENTRY_AUTH_TOKEN
        if: ${{ (inputs.profile || 'preview') == 'production' }}
        env:
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/eas-env-list.err"
          names() {
            local out
            if ! out="$(eas env:list production --format short --scope "$1" 2>"$err")"; then
              # stderr: this runs inside $(...), whose stdout is captured.
              echo "::error::Could not list the EAS production environment ($1 scope), so this preflight cannot tell whether source maps will upload." >&2
              sed 's/^/  /' "$err" >&2
              exit 1
            fi
            printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' | tr -d '=' || true
          }
          project="$(names project)"
          account="$(names account)"
          echo "EAS production environment: $(printf '%s\n' "$project" | grep -c . || true) project and $(printf '%s\n' "$account" | grep -c . || true) account variable name(s) listed (values not shown)."
          if printf '%s\n%s\n' "$project" "$account" | grep -qx 'SENTRY_AUTH_TOKEN'; then
            echo "SENTRY_AUTH_TOKEN is defined in the EAS production environment — source maps will upload."
          else
            echo "::error::SENTRY_AUTH_TOKEN is not in the EAS production environment, so this production build would ship without source maps and every crash report would be unreadable. Add it with visibility 'secret' (eas env:create --environment production --name SENTRY_AUTH_TOKEN --visibility secret), see docs/SENTRY_OBSERVABILITY.md, or run the preview profile instead."
            exit 1
          fi

      # NOTE: a `mobile-build-*` tag push has no `inputs`, so it falls through to
      # the `preview` profile — an INTERNAL APK, not a submittable production
      # build. Tagging is therefore not a release. Use the Actions tab and pick
      # `production` explicitly. Left as-is rather than silently changing what a
      # tag does, because that would alter release behaviour without approval.
      #
      # For production iOS, --auto-submit queues the finished archive for App
      # Store Connect/TestFlight using submit.production.ios in eas.json. Android
      # is intentionally NOT auto-submitted. When platform=all, split the calls
      # so only the iOS half gets --auto-submit; this fixes the prior PR #207 P1
      # where `all` built iOS successfully but silently skipped TestFlight.
      - name: Submit EAS build
        env:
          PLATFORM: ${{ inputs.platform || 'android' }}
          PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          set -euo pipefail

          if [ "$PROFILE" != "production" ]; then
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
            exit 0
          fi

          case "$PLATFORM" in
            ios)
              eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
              ;;
            android)
              eas build --platform android --profile production --non-interactive --no-wait
              ;;
            all)
              # Keep Android as build-only. Queue iOS separately with auto-submit
              # so TestFlight is never skipped just because "all" was selected.
              eas build --platform android --profile production --non-interactive --no-wait
              eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
              ;;
            *)
              echo "::error::Unsupported platform: $PLATFORM"
              exit 2
              ;;
          esac