name: Design system

# Guards the "Ember on Cream" design system:
#   1. the generated per-app token mirrors have not been hand-edited or drifted
#      away from design-system/ (the repo is not an npm workspace, so the
#      mirrors ARE the sharing mechanism — silent drift would be invisible);
#   2. the design-system trees stay free of hardcoded colours, font families,
#      shadows and currency strings;
#   3. types and unit tests still pass on both apps.
#
# Deliberately scoped to what this PR introduced. It does not gate unrelated
# pre-existing code, so it cannot become a blanket blocker on other work.

# The pull_request trigger is deliberately NOT filtered by base branch.
#
# It used to read `pull_request: branches: [claude/project-build-ie4b56, main]`.
# A `branches:` filter on pull_request matches the BASE branch, so a STACKED pull
# request — one feature branch based on another, which is how this repository
# already works (PR #146 was based on PR #145) — matched nothing and merged
# having run no typecheck and no unit tests at all. That is 1660 tests skipped on
# the repository's own documented workflow, on exactly the pull requests that are
# hardest to review.
#
# The steps stay here rather than moving into production-gates.yml: both
# workflows would then have to install BOTH dependency trees, roughly doubling
# CI time for every pull request to fix a trigger bug.
#
# `push:` stays filtered. A push run on every feature branch would double the
# work for no signal — the pull_request run already covers it.
#
# `workflow_dispatch:` exists for the case where GitHub drops the event rather
# than the workflow declining it. On 2026-08-21 a push to a pull request head
# created NO workflow runs at all — no `pull_request` synchronize event fired,
# confirmed against the run list, seventeen minutes after the push and with no
# `paths:` filter that could explain it. The other three workflows already
# declared `workflow_dispatch` and could be re-run by hand; this one could not,
# so `design-system` — one of the always-required contexts in CLAUDE.md §12 —
# was left with no run on that commit and no way to give it one short of
# pushing a commit that existed only to nudge CI.
#
# That is the whole reason this is here: it makes a dropped event recoverable
# without a fake commit. It does NOT weaken the gate. A manual run still runs
# every step, and because `pull_request` is unfiltered above, the ordinary path
# is unchanged — this is a manual fallback, never the normal trigger.
on:
  pull_request:
  push:
    branches: [claude/project-build-ie4b56, main]
  workflow_dispatch:

# Read-only. This workflow only inspects the checkout — it never comments,
# pushes, publishes or touches releases. Declared explicitly rather than
# inheriting the repository default, which may be read-write.
permissions:
  contents: read

# One run per ref: a rapid series of pushes to a PR supersedes itself instead
# of queueing several full installs of both apps.
concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs, not floating tags: a tag can be
      # repointed, and this job runs on pull_request against the default branch.
      # fetch-depth: 0 is required by the formatting step: it diffs this branch
      # against its merge base with the target, and a shallow clone has no merge
      # base to find. Every other step here reads only the working tree.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Single source of truth: .nvmrc (Node 22 — see docs/NODE_VERSION.md).
          # Read from the file rather than hardcoded so the version cannot drift
          # between workflows again. Node 20 is not viable here: the unit suite
          # imports src/lib/supabase.ts and @supabase/realtime-js requires a
          # native global WebSocket, which Node 20 does not provide
          # ("Error: Node.js detected but native WebSocket not found").
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      # MUST run before `npm test`. vitest.config.ts includes
      # apps/mobile/src/**/*.test.ts, and Vite resolves the nearest tsconfig for
      # those files — apps/mobile/tsconfig.json extends "expo/tsconfig.base",
      # which only resolves once apps/mobile/node_modules exists. With the
      # installs the other way round every mobile suite dies with
      # TSConfckParseError before a single assertion runs.
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci --no-audit --no-fund

      - name: Token mirrors in sync and design-system code is token-pure
        run: npm run design-system:check

      # The brand mark is generated the same way the tokens are, and drifting is
      # the same class of failure. `logo:check` existed and NO workflow ran it,
      # so a hand-edited logo asset could land unnoticed (found 2026-09-02).
      - name: Brand mark matches its generator
        run: npm run logo:check

      # Two narrow rules on this branch's diff: a file ADDED here must be
      # Prettier-clean, and a file CHANGED here must not be machine-compressed.
      # NOT "Prettier must pass on everything" — 318 of 400 tracked TypeScript
      # files would fail that today, so it would attach a several-hundred-line
      # reformat to every one-line fix. The header of scripts/format-check.mjs
      # has the measurements. Needs the merge base, hence fetch-depth: 0 above.
      - name: Formatting (new files) and no machine-compressed source
        env:
          FORMAT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: npm run format:check

      - name: Typecheck (web)
        run: npm run lint

      - name: Typecheck (mobile)
        run: npm --prefix apps/mobile run typecheck

      - name: Unit tests
        run: npm test