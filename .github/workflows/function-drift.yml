name: Edge Function drift (read-only)

# Answers a question nothing in this repository could answer before: WHICH Edge
# Functions exist in production, and does that set match the repository?
#
# Why it matters: deploy-functions.yml covers 4 of the 21 functions in
# supabase/functions/. The other 17 reach production by hand, and nothing records
# what is deployed or which commit it was built from. During an incident,
# "roll back the function" currently means reading git history and guessing
# (docs/ROLLBACK.md §2).
#
# STRICTLY READ-ONLY. It runs `supabase functions list` — a query — and compares
# names. It has no deploy step, cannot create or update a function, and declares
# `permissions: contents: read`. It is deliberately a separate workflow from
# deploy-functions.yml so that nothing here can ever be one edit away from a
# deploy, and so the frozen payment functions (CLAUDE.md §6) are never touched.
#
# It does NOT compare CONTENT. Matching names do not prove the deployed code
# matches the repository — the Supabase CLI exposes no content hash. Treat a
# green run as "the right set of functions exists", not "production matches main".
#
# Requires a SUPABASE_ACCESS_TOKEN secret. Until that exists this workflow will
# fail at the list step, which is honest: without it, nobody can see what is
# deployed. See docs/OWNER_ACTIONS.md §15 BEFORE adding that secret. It arms a
# much more dangerous path in deploy-functions.yml, and — the larger point — a
# Supabase access token CANNOT be scoped to one project: it carries the whole
# account, every organisation and every project, into a PUBLIC repository's
# secrets. §15 recommends against adding it and gives the safer alternative.

on:
  schedule:
    # 06:00 UTC = 09:00 Asia/Riyadh, so a weekday drift report is waiting before
    # the lunch service rather than arriving mid-rush.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Compare deployed functions against the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      - name: List deployed functions and diff against the repository
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: wxfmmnihidsdyemasstf
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the deployed function list cannot be read. See docs/OWNER_ACTIONS.md §15 before adding it."
            exit 1
          fi

          # Every directory under supabase/functions/ that has an index.ts is a
          # deployable function. _shared/ has no entrypoint and is excluded by
          # that rule rather than by name.
          for d in supabase/functions/*/; do
            [ -f "${d}index.ts" ] || continue
            basename "$d"
          done | sort > /tmp/repo.txt

          supabase functions list --project-ref "$PROJECT_REF" \
            | awk 'NR > 1 && $1 != "" { print $1 }' \
            | sort > /tmp/deployed.raw

          # Keep only names that look like slugs, so a header or a formatting
          # change in the CLI output cannot masquerade as a function name.
          grep -E '^[a-z0-9][a-z0-9-]*$' /tmp/deployed.raw | sort -u > /tmp/deployed.txt || true

          echo "Repository entrypoints: $(wc -l < /tmp/repo.txt)"
          echo "Deployed functions:     $(wc -l < /tmp/deployed.txt)"
          echo

          MISSING="$(comm -23 /tmp/repo.txt /tmp/deployed.txt)"
          EXTRA="$(comm -13 /tmp/repo.txt /tmp/deployed.txt)"

          STATUS=0

          if [ -n "$MISSING" ]; then
            STATUS=1
            echo "::error::In the repository but NOT deployed — this code is not running in production:"
            echo "$MISSING" | sed 's/^/  - /'
            echo
          fi

          if [ -n "$EXTRA" ]; then
            STATUS=1
            echo "::warning::Deployed but NOT in the repository — orphaned, or renamed without removing the old one. An orphan still accepts requests:"
            echo "$EXTRA" | sed 's/^/  - /'
            echo
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "No drift: every repository entrypoint is deployed and nothing extra is running."
            echo "(Names only — this does not prove the deployed CODE matches the repository.)"
          fi

          exit "$STATUS"