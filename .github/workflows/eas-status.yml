name: EAS Build Status (read-only)

# Read-only helper: polls EAS for the status + artifact (APK) URL of an already
# submitted build and prints them to this job's log. It runs `eas build:view`
# (a QUERY) — it never starts a build. Requires EXPO_TOKEN.
#
# TRIGGER: this used to be
#
#     push:
#       paths:
#         - '.github/workflows/eas-status.yml'
#
# with no `branches:` filter, so ANY push on ANY branch that touched this file
# ran a job holding EXPO_TOKEN with the repository-default (possibly read-write)
# GITHUB_TOKEN. That is the same shape as the deploy-functions.yml trigger
# removed on 2026-08-05 — read-only in what it does, but reachable from an
# unreviewed branch, which is the part that matters. Editing a file is not a
# sensible way to ask for a status check. Run it from the Actions tab.
#
# BUILD ID IS AN INPUT AS OF 2026-09-02. It used to be a literal env constant
# (`BID: a168a7f1-…`), so every run — forever — re-reported the status of one
# build from the past, and asking about the CURRENT build meant editing the
# workflow, which is exactly the "editing a file to ask a question" pattern the
# trigger note above exists to stop. The old value is kept as the default so an
# argument-less run behaves as it always did.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build id to poll (find it with `eas build:list`, or in the Expo dashboard URL).'
        required: false
        type: string
        default: a168a7f1-bfc5-482c-85ae-4a3afce3aa76

# Least privilege: this job only reads the checkout and queries EAS. Declared
# explicitly rather than inheriting the repository default.
permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        # Pinned to a commit SHA, matching the other workflows in this
        # repository: a tag can be repointed, and this job holds a secret.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes. Leaving the token in .git/config would make
          # it available to every later step and to anything they invoke.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Single source of truth: .nvmrc (Node 22 — see docs/NODE_VERSION.md).
          # Was hardcoded to 20, the only workflow left behind the rest of the
          # repository. `node-version-file` resolves from the repository root
          # and is unaffected by this job's `working-directory: apps/mobile`.
          node-version-file: .nvmrc

      - name: Setup EAS / Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile deps (so eas can resolve the app config)
        run: npm ci

      - name: Poll EAS build until it finishes
        env:
          BID: ${{ inputs.build_id }}
          EXPO_NO_TELEMETRY: "1"
        run: |
          set +e
          for i in $(seq 1 40); do
            # eas-cli can prepend update-notice lines to stdout; strip everything
            # before the first JSON bracket so jq always gets clean JSON.
            # Run INSIDE apps/mobile: eas-cli 21.x refuses to run outside a project
            # ("Run this command inside a project directory"). node_modules is installed
            # in the step above so the app config plugins resolve.
            RAW=$(eas build:view "$BID" --json 2>/dev/null)
            JSON=$(printf '%s\n' "$RAW" | awk '/^[[{]/{f=1} f{print}')
            STATUS=$(printf '%s' "$JSON" | jq -r '.status // empty' 2>/dev/null)
            echo "poll $i: status=${STATUS:-unparsed}"
            if [ -z "$STATUS" ]; then
              echo "--- raw head (first 3 lines) ---"; printf '%s\n' "$RAW" | head -3
            fi
            if [ "$STATUS" = "FINISHED" ] || [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "=== FINAL BUILD SUMMARY ==="
              printf '%s' "$JSON" | jq '{id, status, platform, appVersion, gitCommitHash, createdAt, completedAt, error}'
              echo "=== ARTIFACTS ==="
              printf '%s' "$JSON" | jq '.artifacts'
              echo "=== APK_URL ==="
              printf '%s' "$JSON" | jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // "none"'
              exit 0
            fi
            sleep 30
          done
          echo "Timed out; build still not terminal."