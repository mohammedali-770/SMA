# Minimal Supabase CLI config. Extend as needed (auth, storage, edge runtime).
project_id = "spicy-meal"

[db]
major_version = 15

# ---- Edge Functions ------------------------------------------------------
# verify_jwt controls whether Supabase requires a valid user JWT to invoke the
# function. External/scheduled callers (provider webhooks, sync workers, Auth
# hooks) set it false and authenticate by another explicit mechanism
# (signature / service role / dedicated secret); user-initiated functions keep
# it true.
[functions.order-intake]
verify_jwt = true

# PROVISIONAL/FROZEN payment surface. The signed-in customer initiates payment
# for their own order/session. Current source supports Tap (hosted charge) and
# Moyasar (hosted invoice), and retains older Geidea scaffold code, but the final
# provider has NOT been selected and Moyasar is inert — see CLAUDE.md §6.
[functions.payment-initiate]
verify_jwt = true

# PROVISIONAL/FROZEN provider webhook surface. No user JWT; provider authenticity
# is verified inside the function — Tap by its HMAC hashstring, Moyasar by the
# `secret_token` in the body. Neither is trusted as evidence of payment: both
# paths re-fetch server-to-server before confirming anything. See
# docs/PAYMENT_POSTPONEMENT.md before touching any payment function or provider
# configuration.
[functions.payment-webhook]
verify_jwt = false

[functions.lazywait-sync]
verify_jwt = false

# Admin-initiated Lazywait catalog pull (from the browser). Requires a valid
# user JWT; the function additionally checks is_admin() before touching the API.
[functions.lazywait-catalog]
verify_jwt = true

# Called by Lazywait POS; authenticated by the HMAC webhook signature.
[functions.lazywait-webhook]
verify_jwt = false

# Expo push sender — LIVE. Credentials configured and the `push`/`expo`
# integration master flag is enabled, so this delivers to real customer
# devices. Disabling that row is the kill switch for all sending.
[functions.push-dispatch]
verify_jwt = false

# Legacy/custom WhatsApp OTP is used only for ownership verification of the
# signed-in customer's AUTH-OWNED phone. Both send and verify require a JWT and
# additionally resolve auth.getUser() + bind the requested phone to user.phone.
# Real login OTP delivery uses the separate signed Supabase Auth hook below.
[functions.whatsapp-send-otp]
verify_jwt = true

[functions.whatsapp-verify-otp]
verify_jwt = true

# Called by Meta; authenticated by the app-secret signature in the function.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-test-config]
verify_jwt = true

# Supabase Auth "Send SMS" Hook for REAL customer phone-OTP login. Supabase Auth
# generates the login OTP and calls this only to deliver it over WhatsApp; the
# call is authenticated by the Standard Webhooks signature (verify_jwt=false,
# no user JWT).
[functions.auth-send-sms-whatsapp]
verify_jwt = false

# Admin-only SMTP status + test-send. Requires a valid admin JWT; reads the SMTP
# password server-side and never returns it.
[functions.email-test-config]
verify_jwt = true

# Admin-only provisioning for the branch-operations roles. verify_jwt only
# proves someone signed in, so the function additionally calls public.is_admin()
# as the caller — role 'admin' AND AAL2 — and can touch branch_staff /
# call_center accounts only.
[functions.staff-accounts]
verify_jwt = true

# ---- Provisional payment/refund functions (FROZEN) -----------------------
# These functions remain in source for the existing checkout stack, but ordinary
# work must not change/deploy/test them while the final payment provider is
# unresolved. Authoritative decision: docs/PAYMENT_POSTPONEMENT.md.

# Customer-side Tap verification path. Requires a valid user JWT and reads the
# customer's own order/session under RLS before server-side provider checks.
[functions.payment-verify]
verify_jwt = true

# Public HTTPS return page used by the existing Tap checkout path. It does not
# trust the browser to mark payment state by itself.
[functions.payment-return]
verify_jwt = false

# Refund processor. No user JWT because it is a server/scheduled path; it fails
# closed behind its dedicated authentication contract. Automated refund
# scheduling is intentionally disabled while payment/refund work is frozen.
[functions.payment-refund]
verify_jwt = false

# Admin-only Tap configuration/diagnostic test surface. Frozen with the rest of
# the payment area; secret values remain server-side.
[functions.payment-test-config]
verify_jwt = true

# Public informational return page for the isolated admin Tap test checkout.
[functions.tap-admin-test-return]
verify_jwt = false

# ---- Account deletion ----------------------------------------------------
# Customer requests deletion of their OWN account. Requires a valid user JWT;
# the user identity is derived from Auth, never trusted from an arbitrary body.
[functions.account-delete-request]
verify_jwt = true

# Service-side processor for the deletion queue. verify_jwt=false because it is
# called only through the backend/service authentication path.
[functions.account-delete-process]
verify_jwt = false

# Vault/dedicated-secret authenticated cron gateway into account-delete-process.
[functions.account-delete-scheduler]
verify_jwt = false
