# Minimal Supabase CLI config. Extend as needed (auth, storage, edge runtime).
project_id = "spicy-meal"

[db]
major_version = 15

# ---- Edge Functions ------------------------------------------------------
# verify_jwt controls whether Supabase requires a valid user JWT to invoke the
# function. External/scheduled callers (gateway webhooks, sync workers, OTP
# pre-login) set it false and authenticate by other means (signature / service
# role); user-initiated functions keep it true.
[functions.order-intake]
verify_jwt = true

# The signed-in customer starts paying for their own order (Geidea session).
[functions.payment-initiate]
verify_jwt = true

# Called by Geidea's servers; authenticated by the HMAC callback signature.
[functions.payment-webhook]
verify_jwt = false

[functions.lazywait-sync]
verify_jwt = false

# Admin-initiated Lazywait catalog pull (from the browser). Requires a valid
# user JWT; the function additionally checks is_admin() before touching the API.
[functions.lazywait-catalog]
verify_jwt = true

# Called by Lazywait POS; authenticated by the HMAC webhook signature.
[functions.lazywait-webhook]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

# WhatsApp OTP (Meta Cloud API). Send/verify are pre-login-capable (false) and
# rate-limited + generic-response server-side; the webhook is called by Meta and
# authenticated by the app-secret signature; test-config requires an admin JWT.
[functions.whatsapp-send-otp]
verify_jwt = false

[functions.whatsapp-verify-otp]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-test-config]
verify_jwt = true

# Supabase Auth "Send SMS" Hook for REAL customer phone-OTP login. Supabase Auth
# generates the login OTP and calls this to deliver it over WhatsApp; the call is
# authenticated by the Standard Webhooks signature (verify_jwt=false, no user JWT).
[functions.auth-send-sms-whatsapp]
verify_jwt = false

# Admin-only SMTP status + test-send. Requires a valid admin JWT; reads the SMTP
# password server-side and never returns it.
[functions.email-test-config]
verify_jwt = true

# ---- Tap Payments (Hosted Checkout) --------------------------------------
# The customer verifies their own paid order after returning from Tap. Requires a
# valid user JWT; retrieves the charge from Tap server-side and confirms only on
# CAPTURED. The order is read via the user's RLS so they can verify only their own.
[functions.payment-verify]
verify_jwt = true

# The HTTPS page Tap redirects the browser to after checkout. Bounces back into
# the app via the spicymeal:// deep link; marks nothing paid. No JWT (public page).
[functions.payment-return]
verify_jwt = false

# Admin-only Tap status + harmless key check + isolated admin TEST checkout
# (create + Retrieve-Charge verify). Requires a valid admin JWT; reads the secret
# key server-side and never returns it; never touches orders/payments/Lazywait.
[functions.payment-test-config]
verify_jwt = true

# The HTTPS page Tap redirects the admin's browser to after the isolated admin
# TEST checkout. Informational only; marks nothing. No JWT (public page).
[functions.tap-admin-test-return]
verify_jwt = false

# ---- Account deletion ----------------------------------------------------
# Customer requests deletion of their OWN account. Requires a valid user JWT; the
# user id comes from the JWT (never the body). Sends an OTP to the registered
# phone and/or re-verifies the password, then idempotently enqueues the request.
[functions.account-delete-request]
verify_jwt = true

# Service-role processor for the deletion queue. verify_jwt=false because it is
# called by the trusted backend (service-role bearer) or a scheduler (shared
# secret) — NEVER by a client. It performs the anonymization + GoTrue Auth
# deletion; it must never be reachable with only a user JWT.
[functions.account-delete-process]
verify_jwt = false
