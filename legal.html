<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Legal &amp; Policies — Spicy Meal</title>
    <meta
      name="description"
      content="Privacy policy, terms, refund, delivery and payment policies for the Spicy Meal app."
    />
    <!--
      A SECOND, DELIBERATELY TINY ENTRY. This page exists so App Store Connect and
      Play Console have a privacy-policy URL a reviewer can open with no account —
      an in-app screen does not satisfy either store. It must therefore load fast,
      work on a cold visit, and never depend on the admin console bundle, so the
      styles are inline here rather than pulled from the design system.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #5f5f5f;
        --line: #e3e3e3;
        --link: #9b1c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #ededed;
          --muted: #a6a6a6;
          --line: #2e2e2e;
          --link: #ff8f8f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.65 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      #app {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.6rem;
        line-height: 1.25;
        margin: 0.75rem 0 0.5rem;
      }
      .meta,
      .notice,
      .contact {
        color: var(--muted);
        margin: 0.35rem 0 1rem;
      }
      .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
      }
      ul.docs {
        list-style: none;
        margin: 1.25rem 0 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      ul.docs li {
        border-bottom: 1px solid var(--line);
      }
      ul.docs a {
        display: block;
        padding: 0.9rem 0.25rem;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }
      .back {
        display: inline-block;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }
      button {
        font: inherit;
        color: var(--link);
        background: none;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.45rem 0.8rem;
        cursor: pointer;
      }
      button.lang {
        float: right;
        margin-inline-start: 1rem;
      }
      :where(a, button):focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
      @media print {
        button {
          display: none;
        }
      }
      /*
        The build-time snapshot of the policies. It exists for clients that do
        not run JavaScript — chiefly Play Console's and App Store Connect's
        policy-URL checks, which fetch the page and read the markup.

        HIDDEN BY DEFAULT AND REVEALED BY <noscript>, rather than hidden by a
        script. The first version set a class from an inline <script>, and
        `vercel.json` serves `script-src 'self' https://maps.googleapis.com` on
        `/(.*)` with no nonce, hash or 'unsafe-inline' — so that script would
        have been BLOCKED on every deployed legal route, the class never set,
        and every visitor would have seen the live policy with a stale duplicate
        underneath it. Worse than the defect this file exists to fix. Caught by
        review on #381.

        A <noscript><style> applies only when scripting is off, and `style-src`
        does carry 'unsafe-inline', so this needs no script and no CSP change. A
        text extractor reads the markup and never consults CSS, so `display:
        none` costs it nothing.
      */
      #prerendered {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      #prerendered article {
        margin-top: 2rem;
      }
      #prerendered h2 {
        font-size: 1.25rem;
        margin: 1.25rem 0 0.25rem;
      }
      #prerendered {
        display: none;
      }
    </style>
    <noscript>
      <style>
        #prerendered {
          display: block;
        }
      </style>
    </noscript>
  </head>
  <body>
    <main id="app"></main>
    <!--prerender:legal:start-->
    <noscript>
      <div style="max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem">
        <h1>Legal &amp; Policies — Spicy Meal</h1>
        <p>
          These documents are loaded from our servers and need JavaScript enabled. They are also available in
          the Spicy Meal app under Profile → Legal.
        </p>
        <p>Contact: info@spicymeal.com.sa · 9200 31495</p>
      </div>
    </noscript>
    <!--prerender:legal:end-->
    <script type="module" src="/src/legal/main.ts"></script>
  </body>
</html>
